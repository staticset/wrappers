name: mssql_fdw_rq

# CI matrix for the mssql_fdw_rq fork: PostgreSQL 15 + 17 against a live
# MSSQL 2022 service with the rqtest database (TZ §3, §8).
on:
  push:
    branches: [feat/mssql-fdw-rq]
    paths:
      - "supabase-wrappers/**"
      - "wrappers/src/fdw/mssql_fdw_rq/**"
      - "wrappers/Cargo.toml"
      - "wrappers/.dev/mssql/**"
      - ".github/workflows/mssql-fdw-rq.yml"
  pull_request:
    paths:
      - "supabase-wrappers/**"
      - "wrappers/src/fdw/mssql_fdw_rq/**"
      - "wrappers/Cargo.toml"
      - "wrappers/.dev/mssql/**"
      - ".github/workflows/mssql-fdw-rq.yml"

permissions:
  contents: read

jobs:
  test:
    name: pg${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 17]

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: MssqlRq_2026!Pass
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'MssqlRq_2026!Pass' -b -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      MSSQL_HOST: localhost
      MSSQL_PORT: "1433"
      MSSQL_SA_PASSWORD: MssqlRq_2026!Pass
      # Plain `cargo test` binaries reference postgres server symbols that are
      # only resolved at runtime (see .cargo/config.toml). setup-rust-toolchain
      # exports RUSTFLAGS for later steps, and any RUSTFLAGS in the environment
      # makes cargo ignore the [target] rustflags from .cargo/config.toml —
      # restate the flag here so the test link keeps working.
      RUSTFLAGS: "-Clink-arg=-Wl,--unresolved-symbols=ignore-all"

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Install PostgreSQL ${{ matrix.pg }} (PGDG) and build deps
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq curl ca-certificates build-essential pkg-config \
            libssl-dev libkrb5-dev
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq \
            postgresql-client-${{ matrix.pg }} \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }}
          sudo chmod a+rwx \
            "$(/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config --pkglibdir)" \
            "$(/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config --sharedir)"/extension \
            /var/run/postgresql/

      - run: cargo install --locked cargo-pgrx --version 0.16.1
      - run: cargo pgrx init --pg${{ matrix.pg }} /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Initialize rqtest on the MSSQL service
        run: |
          CID=$(docker ps -q -f ancestor=mcr.microsoft.com/mssql/server:2022-latest)
          docker cp .dev/mssql/01_create_db.sql "$CID":/init.sql
          docker exec "$CID" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa \
            -P "$MSSQL_SA_PASSWORD" -b -i /init.sql

      - name: Format
        run: cd wrappers && cargo fmt --check

      - name: Clippy
        run: >-
          cd wrappers && RUSTFLAGS="-D warnings" cargo clippy
          --no-default-features --features "mssql_fdw_rq pg${{ matrix.pg }}"
          --tests --no-deps

      - name: Unit tests (translator)
        run: >-
          cd wrappers && cargo test --lib --no-default-features
          --features "mssql_fdw_rq pg${{ matrix.pg }}" mssql_fdw_rq

      - name: e2e tests (pgrx, live MSSQL)
        run: >-
          cd wrappers && USER=$(id -un) cargo pgrx test pg${{ matrix.pg }}
          --no-default-features --features "mssql_fdw_rq pg${{ matrix.pg }}"

      - name: Kerberos feature compiles
        run: >-
          cd wrappers && cargo check --no-default-features
          --features "mssql_fdw_rq_kerberos pg${{ matrix.pg }}"
